<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Logic Trainer</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0d0f11;--panel:#14171b;--panel2:#1a1e23;--line:#262b31;--ink:#eceae4;--dim:#98a0a9;--red:#e04a45;--green:#46ff8b;--blue:#6cb6ff;--amber:#f2b632}
html{background:var(--bg)}
html,body{overflow-x:hidden}
body{margin:0;color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 520px at 50% -120px,#1c2026,var(--bg))}
button,select,input{font:inherit;color:inherit}
button,select{background:#20252b;border:1px solid #333a42;border-radius:8px;padding:7px 11px;cursor:pointer;transition:background .12s,border-color .12s,transform .08s}
button:hover,select:hover{background:#2a3037;border-color:#47505a}
button:active{transform:translateY(1px)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button.go{background:var(--red);border-color:var(--red);color:#fff;font-weight:650}
button.go:hover{background:#ec5d58;border-color:#ec5d58}
button.danger:hover{border-color:#a83a36;color:#ffb3af}
.sticky{position:sticky;top:0;z-index:30;background:rgba(13,15,17,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px 16px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand b{display:block;font-size:16px;line-height:1.15}
.brand small{color:var(--dim);font-size:11.5px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--red);display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:8px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.logo i{border-radius:50%;background:#111}
.logo i:last-child{background:var(--green);box-shadow:0 0 6px var(--green)}
.chips{display:flex;gap:8px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;white-space:nowrap;color:#d6d9dd}
button.chip{cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;background:#555}
.chip.ok i{background:var(--green);box-shadow:0 0 7px var(--green)}
.chip.bad i{background:#ff5b52;box-shadow:0 0 7px #ff5b52}
.chip.off i{background:#6b7078}
.actions{display:flex;gap:8px;flex:none}
.strip{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.cell{display:flex;align-items:center;gap:6px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.lbl{color:var(--dim);font-size:11.5px;margin-right:2px}
.swatches{display:flex;gap:5px}
.col{width:22px;height:22px;border-radius:50%;border:2px solid #4a5058;padding:0}
.col.on{border-color:#fff;box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--blue)}
.col.auto{background:conic-gradient(#d33 0 25%,#2f6fe0 0 50%,#2fb55a 0 75%,#e0b92f 0)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px 16px;align-items:start}
.stagewrap{position:relative;background:#090a0c;border:1px solid var(--line);border-radius:16px;overflow:hidden}
#hint{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:42px;color:#d3d6da;background:var(--panel);border-bottom:1px solid var(--line);font-size:13.5px}
#hint:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
#stage{overflow:auto;padding:14px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain}
#svg{display:block;margin:0 auto;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:38px;height:38px;padding:0;border-radius:10px;background:rgba(20,23,27,.92);backdrop-filter:blur(6px);font-size:17px}
.zoom button:last-child{font-size:12px}
svg text{user-select:none;-webkit-user-select:none;pointer-events:none}
.hole-hit{fill:transparent}
.hole-hit:hover{fill:rgba(40,130,255,.4)}
.jack circle:first-child{transition:stroke .1s}
.jack:hover circle:first-child{stroke:#fff}
.led{fill:#10281a;stroke:#3a4a40;stroke-width:1.5;transition:fill .08s}
.led.on{fill:#46ff8b;stroke:#b8ffd4;filter:drop-shadow(0 0 5px #46ff8b)}
.ic{cursor:grab}
.ic.sel .body{stroke:#6cb6ff;stroke-width:2.5}
.tg,.pw-sw,.pbtn{cursor:pointer}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:128px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3:before{content:"";width:4px;height:15px;border-radius:2px;background:var(--red)}
.card p{margin:0 0 8px;color:#a8acb3;font-size:13px}
.dip{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font:12px ui-monospace,Menlo,Consolas,monospace}
.pin{display:flex;align-items:center;gap:6px;background:#1b1f24;border-radius:5px;padding:3px 7px;min-width:0}
.pin span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin.r{flex-direction:row-reverse}
.pin b{color:#8d939b;font-weight:600;min-width:18px;text-align:center}
.pin i{margin-left:auto;font-style:normal;padding:0 5px;border-radius:3px;min-width:22px;text-align:center}
.pin.r i{margin-left:0;margin-right:auto}
.hi{background:#1f7a43;color:#d8ffe7}.lo{background:#3a3f46;color:#e3e5e8}.fl{color:#6b7078}
.msg{display:flex;gap:8px;margin:0 0 6px;font-size:13px}
.msg:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px}
.msg.err:before{background:#ff5b52}.msg.warn:before{background:var(--amber)}.msg.ok:before{background:var(--green)}
details{margin-top:6px;color:#a8acb3;font-size:13px}
summary{cursor:pointer}
.foot{padding:4px 14px 22px;text-align:center;color:#6f757d;font-size:12px}
.foot b{color:#aeb3ba;font-weight:600}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:60}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(410px,100vw);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease;z-index:61;display:flex;flex-direction:column}
body.parts #scrim{opacity:1;visibility:visible}
body.parts #drawer{transform:none}
.dhead{display:flex;gap:8px;padding:14px 14px 10px}
#psearch{flex:1;min-width:0;background:#0d0f11;border:1px solid #333a42;border-radius:9px;padding:9px 12px}
#plist{overflow:auto;padding:0 12px 18px;flex:1;overscroll-behavior:contain}
#plist h4{margin:16px 4px 6px;color:var(--dim);font-size:12px;font-weight:600}
.part{display:grid;grid-template-columns:68px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:9px 12px;margin-bottom:6px;border-radius:11px;background:var(--panel2)}
.part b{background:#0a0b0d;border:1px solid #30353b;border-radius:5px;padding:6px 2px;text-align:center;font:700 13px ui-monospace,Menlo,Consolas,monospace}
.part span{color:#c1c5cb;font-size:13px;line-height:1.3}
.part em{font-style:normal;color:var(--dim);font-size:11.5px;white-space:nowrap}
.none{color:var(--dim);padding:18px 6px}
#loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);transition:opacity .45s ease,visibility .45s}
#loader.done{opacity:0;visibility:hidden}
#loader .logo{width:64px;height:64px;border-radius:16px;padding:15px;gap:9px}
#loader h1{margin:0;font-size:22px;font-weight:700}
#loader p{margin:0;color:var(--dim);font-size:13px}
.chase{display:flex;gap:9px}
.chase i{width:12px;height:12px;border-radius:50%;background:#10281a;border:1.5px solid #3a4a40;animation:chase 1.2s infinite}
@keyframes chase{0%,100%{background:#10281a;box-shadow:none}25%{background:var(--green);box-shadow:0 0 10px var(--green)}50%{background:#10281a;box-shadow:none}}
.bar{width:220px;height:4px;border-radius:2px;background:#20252b;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--red);transition:width .3s ease}
#loader .by{position:absolute;bottom:22px;font-size:12px;color:#6f757d}
#loader .by b{color:#aeb3ba;font-weight:600}
@media (max-width:1000px){
.layout{grid-template-columns:1fr;padding:10px}
.side{position:static}
.sticky{position:static}
}
@media (max-width:700px){
.top{flex-wrap:wrap;padding:10px 10px 6px}
.brand small{display:none}
.actions{margin-left:auto}
.chips{order:3;flex:1 1 100%;margin-left:0}
.strip{padding:0 10px 10px}
#stage{height:62vh;height:62dvh;padding:8px}
#drawer{top:auto;left:0;width:100%;height:80vh;height:80dvh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(100%)}
}
@media (prefers-reduced-motion:reduce){.chase i{animation:none}#loader,#drawer,#scrim{transition:none}}
</style>
</head>
<body>
<div id="loader" role="status" aria-live="polite">
  <span class="logo"><i></i><i></i></span>
  <h1>Digital Logic Trainer</h1>
  <div class="chase"><i></i><i style="animation-delay:.1s"></i><i style="animation-delay:.2s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.4s"></i><i style="animation-delay:.5s"></i><i style="animation-delay:.6s"></i><i style="animation-delay:.7s"></i></div>
  <div class="bar"><span id="loadBar"></span></div>
  <p id="loadTxt">Powering up the bench</p>
  <div class="by">Developed by <b>Hamim</b></div>
</div>
<div class="sticky">
<header class="top">
  <div class="brand"><span class="logo"><i></i><i></i></span><div><b>Logic Trainer</b><small>Virtual digital lab bench · v3</small></div></div>
  <div class="chips" id="chips"></div>
  <div class="actions"><button id="partsBtn" class="go">+ Add IC</button><button id="demo">Demo</button></div>
</header>
<div class="strip">
  <div class="cell"><span class="lbl">Wire</span><span id="colors" class="swatches"></span></div>
  <div class="cell"><button id="delSel" class="danger">Delete selected</button><button id="clearW" class="danger">Clear wires</button><button id="clearAll" class="danger">Clear all</button></div>
  <div class="cell"><span class="lbl">Clock</span>
    <select id="clkSel" aria-label="Clock speed">
      <option value="0">Off</option><option value="0.5">0.5 Hz</option><option value="1">1 Hz</option><option value="2">2 Hz</option><option value="5">5 Hz</option><option value="10">10 Hz</option><option value="50">50 Hz</option>
    </select>
  </div>
</div>
</div>
<main class="layout">
  <section class="stagewrap">
    <div id="hint"></div>
    <div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="zoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button id="zFit" aria-label="Fit to screen">Fit</button></div>
  </section>
  <aside class="side"><div class="card" id="info"></div><div class="card" id="diag"></div></aside>
</main>
<footer class="foot">Developed by <b>Hamim</b></footer>
<div id="scrim"></div>
<aside id="drawer" aria-label="IC library">
  <div class="dhead"><input id="psearch" type="search" placeholder="Search: 7400, counter, decoder" aria-label="Search ICs"><button id="pclose" aria-label="Close">✕</button></div>
  <div id="plist"></div>
</aside>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const txt = (p, x, y, s, o = {}) => {
  const t = el('text', {x, y, 'font-size': o.size || 10, fill: o.fill || '#e9e8e2', 'text-anchor': o.a || 'middle', 'font-weight': o.w || 500, 'font-family': o.f || 'system-ui,Segoe UI,sans-serif'}, p);
  t.textContent = s;
  return t;
};

const P = 16, N = 60, GRP = 6, X0 = 62, BY = 176, W = 1160, H = 680;
const colX = c => X0 + c * P + Math.floor(c / 5) * GRP;
const R = {a: BY + 64, b: BY + 80, c: BY + 96, d: BY + 112, e: BY + 128, f: BY + 162, g: BY + 178, h: BY + 194, i: BY + 210, j: BY + 226};
const RL = {'T+': BY + 16, 'T-': BY + 32, 'B+': BY + 262, 'B-': BY + 278};
const ROWS = 'abcdefghij';
const pos = {};

/* ---------- IC library ---------- */
const TY = {};
const sp = s => s.split(' ');
const add = (id, cat, d) => { d.id = id; d.cat = cat; d.k = d.np / 2; TY[id] = d; };
const AND = a => a.every(Boolean) ? 1 : 0, OR = a => a.some(Boolean) ? 1 : 0;
const XOR = a => a.reduce((s, x) => s ^ x, 0), NOT = a => 1 - a[0], BUF = a => a[0];
const NAND = a => 1 - AND(a), NOR = a => 1 - OR(a);

function gate(desc, np, vcc, gnd, names, groups, fn) {
  return {desc, np, vcc, gnd, names: sp(names), ins: groups.flatMap(g => g[0]), outs: groups.map(g => g[1]), init: () => ({}),
    drive(ic, rd, wr) { for (const [i, o] of groups) wr(o, fn(i.map(rd))); }};
}
const Q2 = [[[1, 2], 3], [[4, 5], 6], [[9, 10], 8], [[12, 13], 11]];
const N2 = [[[2, 3], 1], [[5, 6], 4], [[8, 9], 10], [[11, 12], 13]];
const H6 = [[[1], 2], [[3], 4], [[5], 6], [[9], 8], [[11], 10], [[13], 12]];
const T3 = [[[1, 2, 13], 12], [[3, 4, 5], 6], [[9, 10, 11], 8]];
const F4 = [[[1, 2, 4, 5], 6], [[9, 10, 12, 13], 8]];
const nm2 = '1A 1B 1Y 2A 2B 2Y GND 3Y 3A 3B 4Y 4A 4B VCC';
const nm6 = '1A 1Y 2A 2Y 3A 3Y GND 4Y 4A 5Y 5A 6Y 6A VCC';
const nm3 = '1A 1B 2A 2B 2C 2Y GND 3Y 3A 3B 3C 1Y 1C VCC';
const nm4 = '1A 1B NC 1C 1D 1Y GND 2Y 2A 2B NC 2C 2D VCC';
const G = 'Gates';
add('7400', G, gate('Quad 2-input NAND', 14, 14, 7, nm2, Q2, NAND));
add('7402', G, gate('Quad 2-input NOR', 14, 14, 7, '1Y 1A 1B 2Y 2A 2B GND 3A 3B 3Y 4A 4B 4Y VCC', N2, NOR));
add('7404', G, gate('Hex inverter (NOT)', 14, 14, 7, nm6, H6, NOT));
add('7407', G, gate('Hex buffer', 14, 14, 7, nm6, H6, BUF));
add('7408', G, gate('Quad 2-input AND', 14, 14, 7, nm2, Q2, AND));
add('7410', G, gate('Triple 3-input NAND', 14, 14, 7, nm3, T3, NAND));
add('7411', G, gate('Triple 3-input AND', 14, 14, 7, nm3, T3, AND));
add('7414', G, gate('Hex Schmitt-trigger inverter', 14, 14, 7, nm6, H6, NOT));
add('7420', G, gate('Dual 4-input NAND', 14, 14, 7, nm4, F4, NAND));
add('7421', G, gate('Dual 4-input AND', 14, 14, 7, nm4, F4, AND));
add('7427', G, gate('Triple 3-input NOR', 14, 14, 7, nm3, T3, NOR));
add('7430', G, gate('8-input NAND', 14, 14, 7, 'A B C D E F GND Y NC NC G H NC VCC', [[[1, 2, 3, 4, 5, 6, 11, 12], 8]], NAND));
add('7432', G, gate('Quad 2-input OR', 14, 14, 7, nm2, Q2, OR));
add('4075', G, gate('Triple 3-input OR (74HC4075)', 14, 14, 7, nm3, T3, OR));
add('7486', G, gate('Quad 2-input XOR', 14, 14, 7, nm2, Q2, XOR));

function ff(desc, np, vcc, gnd, names, pins, kind) {
  const ins = [], outs = [];
  pins.forEach(p => {
    ins.push(p.clr, p.pre, p.clk, ...(kind === 'D' ? [p.d] : [p.j, p.k]));
    outs.push(p.q, p.qn);
  });
  return {desc, np, vcc, gnd, names: sp(names), ins, outs, init: () => pins.map(() => ({q: 0, qn: 1, p: null})),
    seq(ic, rd) {
      pins.forEach((p, i) => {
        const s = ic.s[i], clk = rd(p.clk), clr = rd(p.clr) === 0, pre = rd(p.pre) === 0;
        if (s.p === null) s.p = clk;
        const edge = kind === 'D' ? (s.p === 0 && clk === 1) : (s.p === 1 && clk === 0);
        if (clr && pre) { s.q = 1; s.qn = 1; }
        else if (clr) { s.q = 0; s.qn = 1; }
        else if (pre) { s.q = 1; s.qn = 0; }
        else if (edge) {
          if (kind === 'D') { s.q = rd(p.d); }
          else {
            const j = rd(p.j), k = rd(p.k);
            if (j && k) s.q = 1 - s.q; else if (j) s.q = 1; else if (k) s.q = 0;
          }
          s.qn = 1 - s.q;
        } else s.qn = 1 - s.q;
        s.p = clk;
      });
    },
    drive(ic, rd, wr) { pins.forEach((p, i) => { wr(p.q, ic.s[i].q); wr(p.qn, ic.s[i].qn); }); }};
}
const FF = 'Flip-flops';
add('7474', FF, ff('Dual D flip-flop, rising edge, active-low preset and clear', 14, 14, 7,
  "1CLR' 1D 1CLK 1PRE' 1Q 1Q' GND 2Q' 2Q 2PRE' 2CLK 2D 2CLR' VCC",
  [{clr: 1, d: 2, clk: 3, pre: 4, q: 5, qn: 6}, {clr: 13, d: 12, clk: 11, pre: 10, q: 9, qn: 8}], 'D'));
add('7476', FF, ff('Dual JK flip-flop, falling edge, active-low preset and clear', 16, 5, 13,
  "1CLK 1PRE' 1CLR' 1J VCC 2CLK 2PRE' 2CLR' 2J 2Q' 2Q 2K GND 1K 1Q' 1Q",
  [{clk: 1, pre: 2, clr: 3, j: 4, k: 14, q: 16, qn: 15}, {clk: 6, pre: 7, clr: 8, j: 9, k: 12, q: 11, qn: 10}], 'JK'));
add('74112', FF, ff('Dual JK flip-flop, falling edge, active-low preset and clear', 16, 16, 8,
  "1CLK 1K 1J 1PRE' 1Q 1Q' 2Q' GND 2Q 2PRE' 2J 2K 2CLK 2CLR' 1CLR' VCC",
  [{clk: 1, k: 2, j: 3, pre: 4, q: 5, qn: 6, clr: 15}, {clk: 13, k: 12, j: 11, pre: 10, q: 9, qn: 7, clr: 14}], 'JK'));

const CR = 'Counters and registers';
function ripple(desc, mod) {
  return {desc, np: 14, vcc: 5, gnd: 10, names: sp('CKB R0(1) R0(2) NC VCC ' + (mod === 5 ? 'R9(1) R9(2)' : 'NC NC') + ' QC QB GND QD QA NC CKA'),
    ins: mod === 5 ? [14, 1, 2, 3, 6, 7] : [14, 1, 2, 3], outs: [12, 9, 8, 11], init: () => ({a: 0, b: 0, pa: null, pb: null}),
    seq(ic, rd) {
      const s = ic.s, ca = rd(14), cb = rd(1);
      if (s.pa === null) { s.pa = ca; s.pb = cb; }
      const r0 = rd(2) && rd(3), r9 = mod === 5 && rd(6) && rd(7);
      if (r9) { s.a = 1; s.b = 4; }
      else if (r0) { s.a = 0; s.b = 0; }
      else {
        if (s.pa === 1 && ca === 0) s.a ^= 1;
        if (s.pb === 1 && cb === 0) s.b = (s.b + 1) % mod;
      }
      s.pa = ca; s.pb = cb;
    },
    drive(ic, rd, wr) { const s = ic.s; wr(12, s.a); wr(9, s.b & 1); wr(8, (s.b >> 1) & 1); wr(11, (s.b >> 2) & 1); }};
}
add('7490', CR, ripple('Decade counter. Wire QA to CKB for BCD count 0 to 9', 5));
add('7493', CR, ripple('4-bit binary counter. Wire QA to CKB for count 0 to 15', 8));
function sync(desc, isSync) {
  return {desc, np: 16, vcc: 16, gnd: 8, names: sp("CLR' CLK A B C D ENP GND LOAD' ENT QD QC QB QA RCO VCC"),
    ins: [1, 2, 3, 4, 5, 6, 7, 9, 10], outs: [14, 13, 12, 11, 15], init: () => ({q: 0, p: null}),
    seq(ic, rd) {
      const s = ic.s, clk = rd(2), clr = rd(1) === 0;
      if (s.p === null) s.p = clk;
      if (!isSync && clr) s.q = 0;
      else if (s.p === 0 && clk === 1) {
        if (isSync && clr) s.q = 0;
        else if (rd(9) === 0) s.q = rd(3) | rd(4) << 1 | rd(5) << 2 | rd(6) << 3;
        else if (rd(7) && rd(10)) s.q = (s.q + 1) & 15;
      }
      s.p = clk;
    },
    drive(ic, rd, wr) { const q = ic.s.q; wr(14, q & 1); wr(13, (q >> 1) & 1); wr(12, (q >> 2) & 1); wr(11, (q >> 3) & 1); wr(15, rd(10) && q === 15 ? 1 : 0); }};
}

}, {passive: false});
stage.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });
stage.addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.1 : 0.9), e.clientX, e.clientY); } }, {passive: false});

/* ---------- persistence ---------- */
let saveT = null;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try { await window.storage.set('trainer:v1', JSON.stringify({ics: ics.map(i => ({id: i.id, type: i.type, c0: i.c0})), wires, sw, power, nextW})); } catch (e) {}
  }, 300);
}
async function load() {
  try {
    const r = await window.storage.get('trainer:v1');
    if (!r) return false;
    const d = JSON.parse(r.value);
    ics = []; d.ics.forEach(i => { if (TY[i.type]) addIc(i.type, i.c0, i.id); });
    wires = d.wires.filter(w => pos[w.a] && pos[w.b]); nextW = d.nextW || wires.length + 1;
    sw = d.sw; power = d.power;
    return true;
  } catch (e) { return false; }
}

window.__trainer = {TY, place: placePart, get ics() { return ics; }};
drawStatic();
for (let n = 0; n < 16; n++) drawSw(n);
if (window.innerWidth < 720) setZoom(0.85); else fit();
const t0 = Date.now();
const step = (pct, msg) => { $('#loadBar').style.width = pct + '%'; $('#loadTxt').textContent = msg; };
const wait = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  step(30, 'Laying out the breadboard');
  await wait(250);
  step(60, 'Loading IC library');
  await load();
  await wait(250);
  step(90, 'Restoring your circuit');
  for (let n = 0; n < 16; n++) drawSw(n);
  renderICs(); renderWires(); build(); settle();
  step(100, 'Ready');
  await wait(Math.max(0, 1500 - (Date.now() - t0)));
  $('#loader').classList.add('done');
  hint(ics.length || wires.length ? 'Circuit restored. Tap a hole or jack to start a wire.' : 'Press Load demo to see a working circuit, or add an IC and start wiring. Tap a hole or jack, then tap where the wire should end.');
})();
})();
</script>
